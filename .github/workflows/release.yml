name: Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'desktop-release' || 'desktop-release-cache' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        run: |
          git merge-base --is-ancestor HEAD origin/main
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$version" = "$(jq -r .version src-tauri/tauri.conf.json)"
          test "$version" = "$(jq -r .version package.json)"
          test "$version" = "$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml)"
          notes="docs/releases/$GITHUB_REF_NAME.md"
          test -s "$notes"
          grep -qx '## 更新与改进' "$notes"
          grep -qx '## 问题修复' "$notes"
      - name: Prepare draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes \
              --notes "$(cat "docs/releases/$GITHUB_REF_NAME.md")" --title "MemDock $GITHUB_REF_NAME"
          fi
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          id="$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: >-
      !cancelled() && (needs.prepare.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            cargo-jobs: 3
          - os: macos-15-intel
            target: x86_64-apple-darwin
            cargo-jobs: 4
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cargo-jobs: 4
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: ${{ matrix.cargo-jobs }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
          save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - run: pnpm install --frozen-lockfile
      - name: Warm release cache
        if: github.event_name == 'workflow_dispatch'
        run: pnpm tauri build --no-bundle --target ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@v1
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
          retryAttempts: 3

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
    steps:
      - name: Validate and publish signed release
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern latest.json
          prefix="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > assets.json
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > release-notes.md
          jq --slurpfile assets assets.json --rawfile notes release-notes.md --arg repo "$GITHUB_REPOSITORY" --arg prefix "$prefix" '
            .notes = ($notes | rtrimstr("\n")) |
            .platforms |= with_entries(
              .value.url as $url |
              ($assets[0] | map(select(
                $url == ("https://api.github.com/repos/" + $repo + "/releases/assets/" + (.id | tostring)) or
                $url == ($prefix + (.name | @uri))
              )) | first) as $asset |
              if $asset then .value.url = ($prefix + ($asset.name | @uri)) else error("Unknown update asset: " + $url) end
            )
          ' latest.json > verified.json
          jq -e --arg version "${GITHUB_REF_NAME#v}" --arg prefix "$prefix" '
            .version == $version and (
              .platforms
              | has("darwin-aarch64") and has("darwin-x86_64") and has("windows-x86_64")
                and all(.[]; (.signature | length > 0)
                  and (.url | startswith($prefix) and (endswith(".sig") | not)))
            )
          ' verified.json
          mv verified.json latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
          # The updater reads signatures from latest.json; keep only the packages it downloads.
          jq -r '.[] | select(.name | endswith(".sig")) | .name' assets.json |
            while IFS= read -r asset; do
              gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes
            done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
