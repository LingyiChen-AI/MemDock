<!--
  macOS 专用图标源：和 memdock-logo.svg 是同一幅画，只是按 Apple 的图标栅格留了边。
  1024 画布里圆角方块占 824（四边各 100px），对应系统图标 80.5% 的实测占比；
  不留边的话 Dock 和 ⌘Tab 里会比相邻 app 大一圈。
  其它平台不用这份：Windows 的 .ico 和托盘图标按各自惯例占满画布。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <g transform="translate(100,100) scale(12.875)">
    <rect width="64" height="64" rx="14" fill="#141413"/>
    <path d="M9 48 C9 30 11 16 15 16 C19 16 22 34 26 34 C30 34 33 16 38 16 C43 16 49 40 54 48" fill="none" stroke="#D97757" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M33 36 C38 34 44 34 50 36" fill="none" stroke="#FAF9F5" stroke-width="4" stroke-linecap="round"/>
    <circle cx="54" cy="48" r="3" fill="#FAF9F5"/>
  </g>
</svg>
