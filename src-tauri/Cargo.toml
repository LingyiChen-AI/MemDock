[package]
name = "memdock"
version = "0.1.9"
description = "Memdock: manage Claude Code and Codex memories"
authors = ["Memdock contributors"]
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "memdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7.0.0"
walkdir = "2"
yaml-rust2 = "0.10"
zstd = "0.13"
sha2 = "0.10"
regex = "1"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
notify = "8"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
base64 = "0.23"
flate2 = "1"
sha1 = "0.10"
ureq = { version = "3", features = ["json", "socks-proxy"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
portable-pty = "0.9.0"
trash = "5.3.0"
tempfile = "3.27.0"
futures-util = { version = "0.3", features = ["sink"] }
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
toml = "1.2"
semver = "1"
tauri-plugin-autostart = "2.7.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 8
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Optimize dependencies (serde_json etc.) in dev builds too: large session files parse several times faster.
[profile.dev.package."*"]
opt-level = 2
